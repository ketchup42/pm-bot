name: pm-bot

x-pm-bot: &pm-bot
  image: pm-bot:linux-amd64
  init: true
  restart: unless-stopped
  user: "${PUID:-1000}:${PGID:-1000}"
  volumes:
    - ./runtime/.env:/app/.env:ro
    - ./runtime/history:/app/history
    - ./runtime/models:/app/models
    - ./runtime/logs:/app/logs
  logging: &pm-bot-logging
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  collector-doge-baseline:
    <<: *pm-bot
    environment:
      LOG_FILE: /app/logs/collector-doge-baseline.log
    command:
      - collect
      - --coin
      - "${DOGE_BASELINE_COLLECT_COIN:-doge}"
      - --frame
      - "${DOGE_BASELINE_COLLECT_FRAME:-5m}"
      - --source
      - "${DOGE_BASELINE_COLLECT_SOURCE:-chainlink-twap-60}"
      - --count
      - "${DOGE_BASELINE_COLLECT_COUNT:-700}"
      - --cycle

  strategy-doge-baseline:
    <<: *pm-bot
    environment:
      LOG_FILE: /app/logs/strategy-doge-baseline.log
    command:
      - strategy:doge-baseline
      - "--${DOGE_BASELINE_STRATEGY_MODE:-debug}"
      - --balance
      - "${DOGE_BASELINE_BALANCE:-100}"
      - --trade-value
      - "${DOGE_BASELINE_TRADE_VALUE:-10}"

  refresh-doge-baseline:
    <<: *pm-bot
    environment:
      LOG_FILE: /app/logs/refresh-doge-baseline.log
    command:
      - refresh:doge-baseline
      - --frame
      - "${DOGE_BASELINE_REFRESH_FRAME:-5m}"
      - --count
      - "${DOGE_BASELINE_REFRESH_COUNT:-50}"
      - --train-count
      - "${DOGE_BASELINE_REFRESH_TRAIN_COUNT:-500}"
      - --replay
      - "${DOGE_BASELINE_REFRESH_REPLAY_COUNT:-100}"
      - --latency-ms
      - "${DOGE_BASELINE_REFRESH_LATENCY_MS:-250}"
